[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mathbuddy"
dynamic = ["version"]
description = "A small local LLM looking over your shoulder in a live jotter/Jupyter session"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["jupyter_client>=8", "pyzmq", "prompt_toolkit>=3"]

[project.optional-dependencies]
test = ["pytest", "ipykernel"]

[project.scripts]
mathbuddy = "mathbuddy.app:main"

[tool.setuptools]
packages = ["mathbuddy"]

[tool.setuptools.dynamic]
version = {attr = "mathbuddy.__version__"}

[tool.setuptools.package-data]
mathbuddy = ["r/*.R"]
