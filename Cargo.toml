[package]
name = "mathbuddy"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
description = "A small local LLM agent for live math sessions: jotter, Jupyter kernels, R and RStudio"
license = "Apache-2.0"
repository = "https://github.com/sandbranch/mathbuddy"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
jupyter-protocol = "2.0.2"
jupyter-zmq-client = { version = "1.0.1", features = ["tokio-runtime"] }
libc = "0.2.189"
ratatui = "0.30.2"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1.26.1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
